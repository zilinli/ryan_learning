<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bolt Console</title>
<meta name="application-name" content="Bolt Console">
<meta name="apple-mobile-web-app-title" content="Bolt">
<meta name="theme-color" content="#070B12">
<meta property="og:title" content="Bolt Console">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/favicon.svg">
<link rel="manifest" href="/manifest.webmanifest">
<style>
  :root {
    --bg: #070B12;
    --panel: #0E1520;
    --panel-2: #121A26;
    --line: rgba(125,211,252,.14);
    --text: #E8EEF6;
    --muted: #8B9BB0;
    --accent: #38BDF8;
    --accent-dim: rgba(56,189,248,.12);
    --ok: #34D399;
    --err: #F87171;
    --run: #FBBF24;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", sans-serif;
    background:
      radial-gradient(900px 420px at 12% -8%, rgba(56,189,248,.08), transparent 50%),
      radial-gradient(700px 380px at 92% 0%, rgba(56,189,248,.05), transparent 46%),
      var(--bg);
    color: var(--text);
    min-height: 100vh;
  }
  header {
    display: flex; align-items: center; gap: 14px;
    padding: 10px 18px;
    border-bottom: 1px solid var(--line);
    background: rgba(14,21,32,.86);
    backdrop-filter: blur(10px);
    position: sticky; top: 0; z-index: 20;
  }
  .mark {
    width: 28px; height: 28px; flex: none;
    display: grid; place-items: center;
    border: 1px solid var(--line);
    color: var(--accent); font-family: var(--mono);
    font-size: 11px; letter-spacing: .08em; font-weight: 700;
  }
  header h1 {
    font-size: 14px; font-weight: 600; letter-spacing: .04em;
    font-family: var(--mono); text-transform: uppercase;
  }
  header .sub { font-size: 11px; color: var(--muted); font-family: var(--mono); letter-spacing: .06em; }
  header .status {
    margin-left: auto; display: flex; align-items: center; gap: 8px;
    font-size: 11px; color: var(--muted); font-family: var(--mono); letter-spacing: .04em;
  }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); }
  .dot.ok { background: var(--ok); box-shadow: 0 0 8px var(--ok); }
  .dot.err { background: var(--err); }
  main {
    display: grid;
    grid-template-columns: 1.15fr 0.95fr;
    gap: 0;
    height: calc(100vh - 53px);
  }
  @media (max-width: 980px) {
    main { grid-template-columns: 1fr; height: auto; min-height: calc(100vh - 53px); }
    .right { min-height: 70vh; border-left: 0; border-top: 1px solid var(--line); }
  }
  .left, .right { display: flex; flex-direction: column; min-height: 0; }
  .right { border-left: 1px solid var(--line); background: var(--panel); }
  .composer {
    padding: 12px 16px 10px;
    border-bottom: 1px solid var(--line);
    background: var(--panel);
  }
  .composer .row { display: flex; gap: 8px; align-items: stretch; }
  select, input[type="text"], textarea {
    font: inherit; color: var(--text); background: var(--bg);
    border: 1px solid var(--line); border-radius: 0; padding: 10px 12px; outline: none;
  }
  select:focus, input:focus, textarea:focus { border-color: var(--accent); }
  select { font-family: var(--mono); font-size: 12px; flex: none; }
  .composer textarea { flex: 1; resize: vertical; min-height: 48px; max-height: 140px; }
  .send {
    flex: none; border: 1px solid var(--accent); background: var(--accent-dim);
    color: var(--accent); padding: 0 18px; cursor: pointer;
    font-family: var(--mono); font-size: 12px; letter-spacing: .08em; font-weight: 600;
  }
  .send:disabled { opacity: .45; cursor: not-allowed; }
  .send:hover:not(:disabled) { background: var(--accent); color: #041018; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .chip {
    font-size: 12px; padding: 4px 10px; cursor: pointer;
    background: transparent; border: 1px solid var(--line); color: var(--muted);
    font-family: var(--mono);
  }
  .chip:hover { border-color: var(--accent); color: var(--accent); }
  .results {
    padding: 14px 16px 24px; display: flex; flex-direction: column; gap: 14px;
    flex: 1; overflow: auto;
  }
  .results h2 {
    font-size: 11px; font-weight: 600; color: var(--muted);
    font-family: var(--mono); letter-spacing: .12em; text-transform: uppercase;
  }
  .turn { display: flex; flex-direction: column; gap: 8px; }
  .bubble { border: 1px solid var(--line); padding: 12px 14px; background: var(--panel); }
  .bubble.user { align-self: flex-end; max-width: 82%; background: var(--accent-dim); font-size: 14px; line-height: 1.55; white-space: pre-wrap; word-break: break-word; }
  .bubble.assistant { width: 100%; }
  .bubble .meta { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; font-size: 11px; color: var(--muted); font-family: var(--mono); }
  .stop-btn {
    margin-left: auto; background: transparent; border: 1px solid rgba(248,113,113,.45);
    color: var(--err); padding: 2px 8px; cursor: pointer;
    font-family: var(--mono); font-size: 10px; letter-spacing: .06em;
  }
  .stop-btn:hover { background: rgba(248,113,113,.14); }
  .badge { font-size: 10px; padding: 2px 7px; font-weight: 600; letter-spacing: .06em; border: 1px solid transparent; }
  .badge.running { color: var(--run); border-color: rgba(251,191,36,.35); }
  .badge.done { color: var(--ok); border-color: rgba(52,211,153,.35); }
  .badge.error { color: var(--err); border-color: rgba(248,113,113,.35); }
  .badge.interrupted { color: #fbbf24; border-color: rgba(251,191,36,.35); }
  .badge.cancelled { color: #fbbf24; border-color: rgba(251,191,36,.35); }
  .out { font-size: 14.5px; line-height: 1.7; word-break: break-word; max-height: 640px; overflow: auto; }
  .out.err { color: var(--err); white-space: pre-wrap; }
  .out.md h1, .out.md h2, .out.md h3, .out.md h4 { font-weight: 650; line-height: 1.3; margin: 1.1em 0 .45em; }
  .out.md h1 { font-size: 1.28em; } .out.md h2 { font-size: 1.12em; } .out.md h3 { font-size: 1.02em; }
  .out.md h1:first-child, .out.md h2:first-child, .out.md h3:first-child { margin-top: 0; }
  .out.md p { margin: .55em 0; }
  .out.md ul, .out.md ol { margin: .45em 0 .45em 1.3em; }
  .out.md li { margin: .2em 0; }
  .out.md blockquote { margin: .6em 0; padding: .2em 0 .2em 12px; border-left: 2px solid var(--accent); color: var(--muted); }
  .out.md hr { border: 0; border-top: 1px solid var(--line); margin: 1em 0; }
  .out.md a { color: var(--accent); }
  .out.md code { font-family: var(--mono); font-size: .86em; background: var(--bg); padding: .12em .4em; }
  .out.md pre { background: var(--bg); border: 1px solid var(--line); padding: 12px 14px; overflow: auto; margin: .7em 0; }
  .out.md pre code { background: none; padding: 0; font-size: 12.5px; line-height: 1.55; }
  .out.md table { border-collapse: collapse; width: 100%; margin: .7em 0; font-size: 13px; }
  .out.md th, .out.md td { border: 1px solid var(--line); padding: 6px 10px; text-align: left; }
  .out.md th { background: var(--bg); font-weight: 600; }
  .out.md img { max-width: 100%; }
  .typing { display: flex; gap: 5px; padding: 6px 0 2px; }
  .typing i { width: 6px; height: 6px; border-radius: 50%; background: var(--muted); animation: bounce 1.2s infinite; }
  .typing i:nth-child(2) { animation-delay: .15s; } .typing i:nth-child(3) { animation-delay: .3s; }
  @keyframes bounce { 0%,80%,100% { opacity: .3; transform: translateY(0); } 40% { opacity: 1; transform: translateY(-4px); } }
  .empty { color: var(--muted); font-size: 12.5px; padding: 28px 12px; text-align: center; font-family: var(--mono); }
  .stage {
    display: flex; flex-direction: column; min-height: 0;
    flex: 1.35; border-bottom: 1px solid var(--line);
  }
  .stage-head {
    display: flex; align-items: center; gap: 8px;
    padding: 10px 12px; border-bottom: 1px solid var(--line);
    background: var(--panel-2);
  }
  .stage-head .path {
    font-size: 12px; flex: 1; word-break: break-all; color: var(--muted);
    font-family: var(--mono);
  }
  .kind-badge {
    font-family: var(--mono); font-size: 10px; letter-spacing: .08em;
    color: var(--accent); border: 1px solid var(--line); padding: 2px 6px; text-transform: uppercase;
  }
  .stage-body {
    flex: 1; overflow: auto; padding: 14px; min-height: 180px;
    display: flex; flex-direction: column;
  }
  .stage-body.plain { white-space: pre-wrap; font-size: 13.5px; line-height: 1.65; }
  .media-frame { display: flex; flex-direction: column; gap: 12px; align-items: center; justify-content: center; min-height: 100%; }
  .media-frame img { max-width: 100%; max-height: min(58vh, 520px); object-fit: contain; border: 1px solid var(--line); cursor: zoom-in; }
  .media-frame img.zoomed { max-height: none; cursor: zoom-out; }
  .media-frame video { width: 100%; max-height: min(52vh, 480px); background: #000; border: 1px solid var(--line); }
  .media-frame audio { width: 100%; }
  .cover { width: 100%; max-height: 220px; object-fit: cover; border: 1px solid var(--line); }
  .player { display: flex; flex-direction: column; gap: 10px; width: 100%; height: 100%; min-height: 0; }
  .player-top { display: flex; flex-direction: column; gap: 8px; flex: none; }
  .player-top .cover { max-height: 96px; object-fit: cover; }
  .lyrics {
    flex: 1; min-height: 140px; overflow: auto;
    text-align: center; padding: 12px 8px 48px;
    mask-image: linear-gradient(transparent, #000 10%, #000 88%, transparent);
    -webkit-mask-image: linear-gradient(transparent, #000 10%, #000 88%, transparent);
  }
  .lyric {
    display: block; width: 100%; border: 0; background: none; cursor: pointer;
    color: var(--muted); font-size: 15px; line-height: 1.65; padding: 5px 6px;
    transition: color .18s ease, transform .18s ease, opacity .18s ease;
  }
  .lyric.section {
    font-family: var(--mono); font-size: 10px; letter-spacing: .14em;
    text-transform: uppercase; opacity: .55; padding-top: 12px;
  }
  .lyric.past { opacity: .32; }
  .lyric.on {
    color: var(--accent); font-weight: 650; font-size: 16.5px;
    transform: scale(1.03); opacity: 1;
  }
  .lyric:hover { color: var(--text); }
  .office-view { font-size: 14px; line-height: 1.65; width: 100%; }
  .office-view .slide {
    border: 1px solid var(--line); padding: 14px 16px; margin-bottom: 10px; background: var(--bg);
  }
  .office-view .slide-n { font-family: var(--mono); font-size: 10px; color: var(--accent); letter-spacing: .12em; margin-bottom: 8px; }
  .office-view table.sheet { border-collapse: collapse; width: 100%; font-size: 12.5px; }
  .office-view table.sheet th, .office-view table.sheet td { border: 1px solid var(--line); padding: 5px 8px; }
  .office-view iframe { width: 100%; min-height: 52vh; border: 1px solid var(--line); background: #fff; }
  .dock { flex: 1; min-height: 160px; display: flex; flex-direction: column; }
  .tabs { display: flex; border-bottom: 1px solid var(--line); }
  .tab {
    flex: 1; background: transparent; border: 0; border-bottom: 2px solid transparent;
    color: var(--muted); padding: 9px 6px; cursor: pointer;
    font-family: var(--mono); font-size: 11px; letter-spacing: .08em; text-transform: uppercase;
  }
  .tab.on { color: var(--accent); border-bottom-color: var(--accent); }
  .tab-body { flex: 1; overflow: auto; padding: 10px 12px 16px; }
  .tree { font-size: 13px; }
  .tree .node { padding: 1px 0; }
  .tree .dir, .tree .file { display: flex; align-items: center; gap: 6px; cursor: pointer; padding: 4px 6px; }
  .tree .dir:hover, .tree .file:hover { background: var(--accent-dim); }
  .tree .file.active { background: var(--accent-dim); color: var(--accent); }
  .tree .dir > .name { font-weight: 600; }
  .tree .children { margin-left: 12px; border-left: 1px solid var(--line); padding-left: 8px; }
  .file-sz { font-size: 11px; color: var(--muted); margin-left: auto; font-family: var(--mono); }
  .ico { font-family: var(--mono); font-size: 10px; color: var(--accent); width: 28px; flex: none; letter-spacing: 0; }
  .arrow { display: inline-block; width: 12px; color: var(--muted); font-size: 10px; }
  .skill-item, .mem-item, .hist-item {
    padding: 8px 10px; border: 1px solid var(--line); margin-bottom: 6px; background: var(--bg);
  }
  .skill-item .n { font-weight: 600; font-size: 13px; }
  .skill-item .d { font-size: 12px; color: var(--muted); margin-top: 3px; line-height: 1.5; }
  .mem-item { display: flex; justify-content: space-between; font-size: 12.5px; }
  .hist-item { font-size: 12.5px; }
  .hist-item .t { color: var(--muted); font-size: 11px; font-family: var(--mono); margin-top: 3px; }

  /* ---- 会话列表 ---- */
  .sessions-bar { display: flex; justify-content: flex-end; margin-bottom: 8px; }
  .sess-item {
    padding: 8px 10px; border: 1px solid var(--line); margin-bottom: 6px; background: var(--bg);
    cursor: pointer; position: relative;
  }
  .sess-item:hover { border-color: var(--accent); }
  .sess-item.active { border-color: var(--accent); background: var(--accent-dim); }
  .sess-item .t { font-size: 12.5px; line-height: 1.4; padding-right: 20px; }
  .sess-item .meta { color: var(--muted); font-size: 11px; font-family: var(--mono); margin-top: 4px; display: flex; gap: 8px; }
  .sess-item .del {
    position: absolute; top: 7px; right: 7px; background: none; border: none;
    color: var(--muted); cursor: pointer; font-size: 13px; line-height: 1; padding: 2px;
  }
  .sess-item .del:hover { color: var(--err); }

  .thread-head { display: flex; align-items: baseline; gap: 10px; margin-bottom: 12px; }
  .thread-head h2 { font-size: 11px; font-weight: 600; color: var(--muted); font-family: var(--mono); letter-spacing: .12em; text-transform: uppercase; }
  .thread-agent {
    font-size: 10px; font-family: var(--mono); color: var(--accent);
    border: 1px solid var(--line); padding: 1px 6px; letter-spacing: .06em;
  }
  .btn {
    border: 1px solid var(--line); background: transparent; color: var(--text);
    padding: 5px 12px; font-size: 11px; cursor: pointer; font-family: var(--mono); letter-spacing: .06em;
  }
  .btn.primary { border-color: var(--accent); color: var(--accent); }
  .btn:hover { background: var(--accent-dim); }

  /* ---- 流式输出（对齐 ryan_learning / Cursor 的思考过程展示）---- */
  .assistant .status-line {
    font-size: 11px; color: var(--run); font-family: var(--mono);
    margin-bottom: 6px; display: flex; align-items: center; gap: 6px;
  }
  .assistant .status-line::before { content: '▸'; color: var(--accent); }
  .assistant .stream-body {
    font-size: 14px; line-height: 1.7; white-space: pre-wrap; word-break: break-word;
    max-height: 520px; overflow: auto; color: var(--text);
  }
  .assistant .stream-body .cursor { display: inline; }
  .assistant .stream-body .cursor::after { content: '▊'; color: var(--accent); animation: blink 1s step-start infinite; }
  @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: 0; } }
  .assistant .tools { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .assistant .tool-chip {
    font-size: 11px; font-family: var(--mono); color: var(--muted);
    border: 1px solid var(--line); padding: 2px 8px;
    display: inline-flex; align-items: center; gap: 5px;
  }
  .assistant .tool-chip.done { color: var(--ok); border-color: rgba(52,211,153,.3); }
  .assistant .tool-chip.running { color: var(--run); border-color: rgba(251,191,36,.3); }

  /* ---- 右上角实时 console ---- */
  .live-console {
    position: fixed; top: 54px; right: 14px; width: 360px; max-height: 62vh;
    background: var(--panel-2); border: 1px solid var(--line);
    display: flex; flex-direction: column; z-index: 50;
    box-shadow: 0 10px 34px rgba(0,0,0,.5);
  }
  .live-head {
    display: flex; align-items: center; gap: 8px; padding: 8px 10px;
    border-bottom: 1px solid var(--line); font-family: var(--mono); font-size: 11px;
  }
  .live-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--run); box-shadow: 0 0 8px var(--run); animation: pulse 1.2s infinite; }
  .live-dot.done { background: var(--ok); box-shadow: 0 0 8px var(--ok); animation: none; }
  .live-dot.err { background: var(--err); box-shadow: 0 0 8px var(--err); animation: none; }
  .live-agent { color: var(--accent); font-weight: 600; }
  .live-msg { flex: 1; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .live-x { background: none; border: none; color: var(--muted); cursor: pointer; font-size: 15px; line-height: 1; }
  .live-body {
    padding: 8px 10px; overflow-y: auto; font-family: var(--mono); font-size: 11px;
    color: var(--muted); line-height: 1.65; max-height: 240px;
  }
  .live-body .tool { color: var(--accent); }
  .live-body .think { color: var(--muted); opacity: .85; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .4; } }

  .hide { display: none !important; }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; }
  }
</style>
</head>
<body>

<header>
  <div class="mark">B</div>
  <div>
    <h1>Bolt Console</h1>
    <div class="sub">OpenClaw · Chat + Artifacts</div>
  </div>
  <div class="status">
    <span id="healthDot" class="dot"></span>
    <span id="healthText">CONNECTING</span>
  </div>
</header>

<main>
  <div class="left">
    <div class="composer">
      <div class="row">
        <select id="agentSel" title="选择智能体">
          <option value="cursor" selected>cursor（主）</option>
          <option value="main">main（OpenClaw）</option>
          <option value="coder">coder（OpenClaw）</option>
          <option value="office">office（OpenClaw）</option>
        </select>
        <textarea id="msg" placeholder="给 Bolt 发指令… 查电量 / 用 Cursor 写脚本 / 生成歌曲 / 分析 CSV"></textarea>
        <button class="send" id="sendBtn" onclick="submit()">SEND</button>
      </div>
      <div class="chips" id="chips"></div>
    </div>
    <div class="results">
      <div class="thread-head">
        <h2 id="threadTitle">新会话</h2>
        <span class="thread-agent" id="threadAgent">cursor</span>
      </div>
      <div id="results"><div class="empty" id="emptyHint">输入指令，或点下方快捷 chips。</div></div>
    </div>
  </div>

  <div class="right">
    <div class="stage">
      <div class="stage-head">
        <span class="kind-badge" id="stageKind">idle</span>
        <span class="path" id="previewPath">选择产物预览 · MD / Office / 音视频 / 图像</span>
        <button class="btn primary hide" id="dlBtn" onclick="downloadCurrent()">DOWNLOAD</button>
      </div>
      <div class="stage-body" id="previewBody">
        <div class="empty">右侧舞台用于打开任务产物。生成歌曲或图片后会自动载入。</div>
      </div>
    </div>
    <div class="dock">
      <div class="tabs">
        <button class="tab on" data-tab="files" onclick="showTab('files')">Files</button>
        <button class="tab" data-tab="skills" onclick="showTab('skills')">Skills</button>
        <button class="tab" data-tab="memory" onclick="showTab('memory')">Memory</button>
        <button class="tab" data-tab="sessions" onclick="showTab('sessions')">Sessions</button>
      </div>
      <div class="tab-body" id="tab-files"><div id="tree" class="tree"><div class="empty">加载中…</div></div></div>
      <div class="tab-body hide" id="tab-skills"><div id="skills"><div class="empty">加载中…</div></div></div>
      <div class="tab-body hide" id="tab-memory"><div id="memory"><div class="empty">加载中…</div></div></div>
      <div class="tab-body hide" id="tab-sessions">
        <div class="sessions-bar">
          <button class="btn primary" onclick="newSession()">＋ 新建会话</button>
        </div>
        <div id="sessions"><div class="empty">暂无会话</div></div>
      </div>
    </div>
  </div>
</main>

<script src="/marked.min.js"></script>
<div class="live-console hide" id="liveConsole">
  <div class="live-head">
    <span class="live-dot" id="liveDot"></span>
    <span class="live-agent" id="liveAgent">cursor</span>
    <span class="live-msg" id="liveMsg">idle</span>
    <button class="live-x" title="关闭" onclick="hideLive()">&times;</button>
  </div>
  <div class="live-body" id="liveBody"></div>
</div>
<script>
document.title = 'Bolt Console';
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtSize = n => n > 1048576 ? (n/1048576).toFixed(1)+' MB' : n > 1024 ? Math.round(n/1024)+' KB' : n+' B';
const fmtTime = ts => { const d = new Date(ts*1000); return d.getFullYear()+'/'+(d.getMonth()+1)+'/'+d.getDate()+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); };
const CHIPS = ["查一下电量","今天天气怎么样","接下来有什么假期","用 Cursor 写代码","深度研究","分析数据","生成 Word 报告","画一张图","生成一首歌","这个月 API 花了多少"];
const KIND_LABEL = { image:'IMAGE', audio:'AUDIO', video:'VIDEO', markdown:'MD', office:'OFFICE', pdf:'PDF', text:'TEXT', other:'FILE', dir:'DIR' };
const KIND_ICO = { image:'IMG', audio:'AUD', video:'VID', markdown:'MD', office:'DOC', pdf:'PDF', text:'TXT', other:'BIN' };

let currentDownload = null;
let lastTree = [];
let activePath = '';
const polling = {};
const streams = {};  // task_id -> { acc, abort, raf } 流式任务状态
let currentSession = null;  // 当前会话 session_id（null = 新会话）
let currentSessionTitle = '';

if (window.marked && marked.setOptions) {
  marked.setOptions({ gfm: true, breaks: true });
}

function sanitize(html) {
  return String(html)
    .replace(/<script[\s\S]*?<\/script>/gi, '')
    .replace(/\son\w+\s*=/gi, ' ')
    .replace(/javascript:/gi, '');
}

function renderMd(src) {
  if (!src) return '';
  let html;
  try {
    html = (window.marked && marked.parse) ? marked.parse(src) : esc(src).replace(/\n/g, '<br>');
  } catch (e) {
    html = esc(src).replace(/\n/g, '<br>');
  }
  return sanitize(html);
}

function kindOf(name) {
  const ext = (name.split('.').pop() || '').toLowerCase();
  if (/^(png|jpe?g|gif|webp|svg|bmp|ico)$/.test(ext)) return 'image';
  if (/^(mp3|wav|m4a|aac|ogg|flac|opus)$/.test(ext)) return 'audio';
  if (/^(mp4|webm|mov|m4v)$/.test(ext)) return 'video';
  if (/^(md|markdown)$/.test(ext)) return 'markdown';
  if (ext === 'pdf') return 'pdf';
  if (/^(docx|pptx|xlsx|doc|xls|ppt|odt|ods|odp)$/.test(ext)) return 'office';
  if (/^(txt|html|json|csv|log|py|sh|js|css|ya?ml|xml|ts|toml|ini|lrc)$/.test(ext)) return 'text';
  return 'other';
}

    $('#healthDot').className = 'dot ' + (d.ok ? 'ok' : 'err');
    $('#healthText').textContent = d.ok ? 'ONLINE · ' + d.port : 'BACKEND ERROR';

    b.className = 'chip'; b.textContent = c;
    b.onclick = () => { $('#msg').value = c; $('#msg').focus(); };

function statusLabel(s) {
  return s === 'done' ? 'DONE' : s === 'error' ? 'ERROR' : s === 'interrupted' ? 'INTERRUPTED' : s === 'cancelled' ? 'STOPPED' : 'RUNNING';
}

function renderTurn(m) {
  const id = 'task-' + m.task_id;
  let el = document.getElementById(id);
  if (!el) {
    el = document.createElement('div');
    el.className = 'turn';
    el.id = id;
    const hint = $('#emptyHint');
    if (hint) hint.remove();
    $('#results').prepend(el);
  }
  const dur = (m.status === 'running') ? '…' : ((m.duration != null ? m.duration : '…') + 's');
  let body = '';
  if (m.error) {
    body = '<div class="out err">' + esc(m.error) + '</div>';
  } else if (m.status === 'running') {
    const status = m.activity ? '<div class="status-line">' + esc(m.activity) + '</div>' : '';
    const tools = (m.tools && m.tools.length)
      ? '<div class="tools">' + m.tools.map(t =>
          '<span class="tool-chip ' + (t.done ? 'done' : 'running') + '">' +
          (t.done ? '✓' : '▸') + ' ' + esc(t.name) + '</span>').join('') + '</div>'
      : '';
    if (m.text) {
      // 流式文本用纯文本渲染 + 闪烁光标，避免频繁 markdown 重渲染
      body = status + '<div class="stream-body">' + esc(m.text) + '<span class="cursor"></span></div>' + tools;
    } else {
      body = status + '<div class="typing" aria-label="正在生成"><i></i><i></i><i></i></div>' + tools;
    }
  } else if (m.status === 'interrupted') {
    body = '<div class="out err">任务已中断（服务曾重启或进程被终止），请重新提交。</div>';
  } else if (m.status === 'cancelled') {
    body = '<div class="out err">任务已停止' + (m.text ? '：' + esc(m.text) : '。') + '</div>';
  } else {
    body = '<div class="out md">' + renderMd(m.text || '') + '</div>';
  }
  const stopBtn = (m.status === 'running')
    ? '<button class="stop-btn" data-task="' + esc(m.task_id) + '" title="停止">■ STOP</button>'
    : '';
  el.innerHTML =
    '<div class="bubble user">' + esc(m.message || '') + '</div>' +
    '<div class="bubble assistant">' +
      '<div class="meta"><span class="badge ' + esc(m.status) + '">' + statusLabel(m.status) + '</span>' +
      '<span>' + esc(m.agent || 'cursor') + '</span><span>' + dur + '</span>' +
      stopBtn +
      '</div>' +
      body +
    '</div>';
  if (stopBtn) {
    el.querySelector('.stop-btn').onclick = () => stopTask(m.task_id);
  }
  updateLive(m);
  return el;
}

function stopTask(task_id) {
  fetch('/api/task/' + encodeURIComponent(task_id) + '/cancel', { method: 'POST' })
    .then(r => r.json())
    .then(d => {
      // SSE 会推送 cancelled 事件；这里兜底：若流已断则直接落定
      if (streams[task_id]) {
        streams[task_id].acc.status = 'cancelled';
        streams[task_id].acc.activity = '已停止';
      }
    })
    .catch(()=>{});
}

function updateLive(m) {
  const box = $('#liveConsole');
  if (!box) return;
  $('#liveAgent').textContent = m.agent || 'cursor';
  if (m.status === 'running') {
    box.classList.remove('hide');
    $('#liveMsg').textContent = m.activity || '';
    $('#liveDot').className = 'live-dot';
    const lines = (m.log || []).map(l => {
      const isTool = /^(执行|完成|✓)/.test(l);
      const isThink = /^· /.test(l);
      return '<div class="' + (isTool ? 'tool' : (isThink ? 'think' : '')) + '">' + esc(l) + '</div>';
    }).join('');
    $('#liveBody').innerHTML = lines;
    $('#liveBody').scrollTop = $('#liveBody').scrollHeight;
  } else {
    $('#liveDot').className = 'live-dot ' + (m.status === 'done' ? 'done' : 'err');
    $('#liveMsg').textContent = m.status === 'done' ? 'DONE' : (m.status === 'cancelled' ? 'STOPPED' : (m.error || 'ERROR'));
  }
}

function hideLive() { $('#liveConsole').classList.add('hide'); }

function submit() {
  const msg = $('#msg').value.trim();
  if (!msg) return;
  const agent = $('#agentSel').value;
  const btn = $('#sendBtn');
  if (btn.disabled) return;
  btn.disabled = true;
  fetch('/api/task', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({message: msg, agent, sessionId: currentSession}) })
    .then(r=>r.json())
    .then(d=>{
      if (!d.task_id) throw new Error(d.error || '提交失败');
      if (d.session_id) {
        currentSession = d.session_id;
        if (!currentSessionTitle) currentSessionTitle = msg.slice(0, 40);
        $('#threadTitle').textContent = currentSessionTitle;
      }
      $('#threadAgent').textContent = agent;
      $('#msg').value = '';
      renderTurn({ task_id: d.task_id, agent, message: msg, status: 'running', text: '', activity: '已提交，等待执行…', tools: [], log: [] });
      streamTask(d.task_id, msg, agent);
    })
    .catch(e=> alert(e.message))
    .finally(()=>{ btn.disabled = false; });
}

function streamTask(task_id, message, agent) {
  // 取消同任务的旧流
  if (streams[task_id]) { try { streams[task_id].abort.abort(); } catch(e){} }
  const acc = { text: '', activity: '', tools: [], status: 'running', log: [], error: null };
  const abort = new AbortController();
  let raf = null;
  streams[task_id] = { acc, abort, raf };

  function schedule() {
    if (raf) return;
    raf = requestAnimationFrame(() => {
      raf = null;
      renderTurn({
        task_id, agent, message,
        status: acc.status, text: acc.text, activity: acc.activity,
        tools: acc.tools, log: acc.log, error: acc.error,
      });
    });
  }

  function finish(finalStatus, text, error) {
    acc.status = finalStatus;
    acc.text = text || acc.text;
    acc.error = error || null;
    delete streams[task_id];
    renderTurn({
      task_id, agent, message,
      status: finalStatus, text: acc.text, activity: acc.activity,
      tools: acc.tools, log: acc.log, error: acc.error,
    });
    refreshSide().then(() => { if (finalStatus === 'done') maybeAutoOpen(); });
  }

  fetch('/api/task/' + encodeURIComponent(task_id) + '/stream', { signal: abort.signal })
    .then(r => {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      const reader = r.body.getReader();
      const dec = new TextDecoder();
      let buf = '';
      const pump = () => reader.read().then(({ done, value }) => {
        if (done) return;
        buf += dec.decode(value, { stream: true });
        let idx;
        while ((idx = buf.indexOf('\n\n')) >= 0) {
          const chunk = buf.slice(0, idx); buf = buf.slice(idx + 2);
          const data = chunk.split('\n').filter(l => l.startsWith('data: ')).map(l => l.slice(6)).join('\n');
          if (!data) continue;
          try { handleEv(JSON.parse(data)); } catch(e){}
        }
        return pump();
      });
      return pump();
    })
    .catch(err => {
      if (err && err.name === 'AbortError') return;
      fallbackPoll(task_id, message, agent);
    });

  function handleEv(ev) {
    switch (ev.type) {
      case 'snapshot':
        if (ev.text) acc.text = ev.text;
        if (ev.activity) acc.activity = ev.activity;
        if (ev.status && ev.status !== 'running') { acc.status = ev.status; if (ev.status === 'error') acc.error = ev.error; }
        schedule();
        break;
      case 'status':
        acc.activity = ev.message || '';
        acc.log.push(acc.activity);
        schedule();
        break;
      case 'thinking':
        acc.activity = '思考中…';
        if (ev.text) {
          (ev.text || '').split('\n').forEach(ln => {
            ln = ln.trim();
            if (ln) acc.log.push('· ' + (ln.length > 180 ? ln.slice(0, 180) + '…' : ln));
          });
        }
        schedule();
        break;
      case 'tool':
        if (ev.phase === 'running') {
          acc.activity = '执行: ' + ev.tool;
          acc.log.push(acc.activity);
          acc.tools.push({ name: ev.tool, done: false });
        } else {
          acc.activity = '完成: ' + ev.tool;
          acc.log.push('✓ ' + ev.tool);
          const ex = acc.tools.find(t => t.name === ev.tool && !t.done);
          if (ex) ex.done = true;
        }
        schedule();
        break;
      case 'delta':
        acc.text += ev.text || '';
        schedule();
        break;
      case 'done':
        finish('done', ev.text || acc.text, null);
        break;
      case 'error':
        finish('error', null, ev.error || 'Cursor 执行失败');
        break;
      case 'cancelled':
        finish('cancelled', acc.text || '（用户已停止）', null);
        break;
    }
  }
}

function fallbackPoll(task_id, message, agent) {
  const tick = () => {
    fetch('/api/task/' + encodeURIComponent(task_id))
      .then(r => { if (!r.ok) throw new Error('not found'); return r.json(); })
      .then(t => {
        t.task_id = t.task_id || task_id;
        if (t.status !== 'running') {
          clearInterval(polling[task_id]);
          delete polling[task_id];
          delete streams[task_id];
          renderTurn({ task_id, agent, message, status: t.status, text: t.text, error: t.error, duration: t.duration, activity: '', tools: [], log: t.log || [] });
          refreshSide().then(() => { if (t.status === 'done') maybeAutoOpen(); });
        } else {
          renderTurn({ task_id, agent, message, status: 'running', text: t.text || '', activity: t.activity || '', tools: [], log: t.log || [] });
        }
      })
      .catch(() => {
        clearInterval(polling[task_id]);
        delete polling[task_id];
        delete streams[task_id];
        renderTurn({ task_id, agent, message, status: 'interrupted', text: '', activity: '', tools: [], log: [] });
      });
  };
  tick();
  polling[task_id] = setInterval(tick, 1500);
}

function maybeAutoOpen(t) {
  fetch('/api/latest').then(r=>r.json()).then(item => {
    if (!item || !item.path) return;
    const age = Date.now()/1000 - (item.mtime || 0);
    if (age > 300) return;
    preview(item.path, item.kind);
  }).catch(()=>{});
}

function showTab(name) {
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('on', t.dataset.tab === name));
  ['files','skills','memory','sessions'].forEach(n => {
    const el = $('#tab-' + n);
    if (el) el.classList.toggle('hide', n !== name);
  });
}

function renderTree(root, nodes) {
  lastTree = nodes;
  root.innerHTML = '';
  if (!nodes.length) { root.innerHTML = '<div class="empty">~/tasks 为空</div>'; return; }
  nodes.forEach(n => { root.appendChild(nodeEl(n)); });
}

function newestMedia(node) {
  let best = null;
  const walk = n => {
    if (n.type === 'file' && /^(image|audio|video|markdown|office|pdf)$/.test(n.kind || kindOf(n.name))) {
      if (!best || (n.mtime||0) > (best.mtime||0)) best = n;
    }
    (n.children||[]).forEach(walk);
  };
  walk(node);
  return best;
}

function nodeEl(n) {
  const wrap = document.createElement('div'); wrap.className = 'node';
  if (n.type === 'dir') {
    const row = document.createElement('div'); row.className = 'dir';
    row.innerHTML = '<span class="arrow">▸</span><span class="name">'+esc(n.name)+'</span>';
    const kids = document.createElement('div'); kids.className = 'children hide';
    (n.children||[]).forEach(c => kids.appendChild(nodeEl(c)));
    row.onclick = () => {
      const closed = kids.classList.toggle('hide');
      row.querySelector('.arrow').textContent = closed ? '▸' : '▾';
      const media = newestMedia(n);
      if (media) preview(media.path, media.kind);
    };
    wrap.appendChild(row); wrap.appendChild(kids);
  } else {
    const k = n.kind || kindOf(n.name);
    const row = document.createElement('div'); row.className = 'file' + (n.path === activePath ? ' active' : '');
    row.dataset.path = n.path;
    row.innerHTML = '<span class="arrow"></span><span class="ico">'+KIND_ICO[k]+'</span><span>'+esc(n.name)+'</span><span class="file-sz">'+fmtSize(n.size)+'</span>';
    row.onclick = () => preview(n.path, k);
    wrap.appendChild(row);
  }
  return wrap;
}

function dirOf(rel) {
  return rel.includes('/') ? rel.slice(0, rel.lastIndexOf('/')) : '';
}

function dirChildren(rel) {
  const dir = dirOf(rel);
  const walk = (nodes) => {
    for (const n of nodes) {
      if (n.type === 'dir' && n.path === dir) return n.children || [];
      if (n.children) {
        const hit = walk(n.children);
        if (hit) return hit;
      }
    }
    return dir === '' ? lastTree : [];
  };
  return walk(lastTree);
}

function findCover(rel) {
  const img = dirChildren(rel).find(c => c.type === 'file' && (c.kind || kindOf(c.name)) === 'image');
  return img ? img.path : null;
}

function findLyrics(rel) {
  const kids = dirChildren(rel).filter(c => c.type === 'file');
  const base = (rel.split('/').pop() || '').replace(/\.[^.]+$/, '');
  const score = (n) => {
    const name = n.name.toLowerCase();
    if (name.endsWith('.lrc')) return name.startsWith(base.toLowerCase()) ? 0 : 1;
    if (name === '歌词.md' || name === 'lyrics.md' || name === 'lyrics.txt') return 2;
    if (name.includes('歌词') && name.endsWith('.md')) return 3;
    if (name.startsWith(base.toLowerCase()) && /\.(md|txt)$/.test(name)) return 4;
    return 99;
  };
  const hit = kids.filter(n => score(n) < 99).sort((a, b) => score(a) - score(b))[0];
  return hit ? hit.path : null;
}

const LRC_RE = /^\[(\d{1,2}):(\d{2})(?:\.(\d{1,3}))?\](.*)$/;

function parseLyrics(text) {
  const raw = String(text || '').replace(/^\uFEFF/, '');
  const timed = [];
  raw.split(/\r?\n/).forEach(line => {
    const m = line.match(LRC_RE);
    if (!m) return;
    const ms = m[3] ? parseInt(m[3].padEnd(3, '0').slice(0, 3), 10) : 0;
    const t = parseInt(m[1], 10) * 60 + parseInt(m[2], 10) + ms / 1000;
    const lyric = m[4].trim();
    if (lyric) timed.push({ t, text: lyric, section: false });
  });
  if (timed.length >= 2) return { timed: true, lines: timed };

  const lines = [];
  raw.split(/\r?\n/).forEach(line => {
    let s = line.trim();
    if (!s || /^(-{3,}|\*{3,})$/.test(s)) return;
    if (/^>/.test(s)) return;
    if (/^\*.*\*$/.test(s) && s.length > 4) return;
    if (/^#{1,6}\s/.test(s)) {
      const title = s.replace(/^#{1,6}\s+/, '').replace(/[`*]/g, '').trim();
      if (title) lines.push({ text: title, section: true });
      return;
    }
    lines.push({ text: s.replace(/^[*-]\s+/, ''), section: false });
  });
  return { timed: false, lines };
}

function assignLyricTimes(parsed, duration) {
  if (!parsed.lines.length) return [];
  if (parsed.timed) return parsed.lines;
  const sung = parsed.lines.filter(l => !l.section);
  const intro = Math.min(4, duration * 0.08);
  const outro = Math.min(3, duration * 0.06);
  const span = Math.max(0.8, duration - intro - outro);
  const n = Math.max(1, sung.length);
  let i = 0;
  return parsed.lines.map(l => {
    const t = intro + (Math.min(i, n - 1) / n) * span;
    if (!l.section) i += 1;
    return { t, text: l.text, section: !!l.section };
  });
}

function bindLyrics(audio, parsed) {
  const box = $('#lyricBox');
  if (!box || !parsed.lines.length) return;
  let timed = [];
  const paint = () => {
    const t = audio.currentTime || 0;
    let idx = 0;
    for (let i = 0; i < timed.length; i++) {
      if (timed[i].t <= t + 0.05) idx = i;
    }
    const nodes = box.querySelectorAll('.lyric');
    nodes.forEach((el, i) => {
      el.classList.toggle('on', i === idx);
      el.classList.toggle('past', i < idx);
    });
    const on = box.querySelector('.lyric.on');
    if (on) {
      const smooth = !window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      on.scrollIntoView({ block: 'center', behavior: smooth ? 'smooth' : 'auto' });
    }
  };
  const mount = () => {
    timed = assignLyricTimes(parsed, audio.duration || 30);
    box.innerHTML = timed.map((l, i) =>
      '<button type="button" class="lyric'+(l.section?' section':'')+'" data-i="'+i+'">'+esc(l.text)+'</button>'
    ).join('');
    box.querySelectorAll('.lyric').forEach(el => {
      el.onclick = () => {
        const i = Number(el.dataset.i);
        if (timed[i]) audio.currentTime = timed[i].t;
      };
    });
    paint();
  };
  if (audio.readyState >= 1 && isFinite(audio.duration) && audio.duration > 0) mount();
  else audio.addEventListener('loadedmetadata', mount, { once: true });
  audio.addEventListener('timeupdate', paint);
  audio.addEventListener('seeked', paint);
}

function setStageMeta(rel, kind) {
  activePath = rel;
  currentDownload = rel;
  $('#previewPath').textContent = rel;
  $('#stageKind').textContent = KIND_LABEL[kind] || kind || 'FILE';
  $('#dlBtn').classList.remove('hide');
  document.querySelectorAll('.tree .file').forEach(el => {
    el.classList.toggle('active', el.dataset.path === rel);
  });
}

function preview(rel, kind) {
  kind = kind || kindOf(rel);
  const enc = encodeURIComponent(rel);
  const mediaUrl = '/api/media?path=' + enc;
  const body = $('#previewBody');
  setStageMeta(rel, kind);
  body.className = 'stage-body';
  body.innerHTML = '<div class="empty">加载中…</div>';

  if (kind === 'image') {
    body.innerHTML = '<div class="media-frame"><img id="stageImg" src="'+mediaUrl+'" alt="'+esc(rel)+'"></div>';
    const img = $('#stageImg');
    img.onclick = () => img.classList.toggle('zoomed');
    return;
  }
  if (kind === 'audio') {
    const cover = findCover(rel);
    const lyricPath = findLyrics(rel);
    body.innerHTML = '<div class="player">' +
      '<div class="player-top">' +
        (cover ? '<img class="cover" src="/api/media?path='+encodeURIComponent(cover)+'" alt="">' : '') +
        '<audio id="stageAudio" controls autoplay src="'+mediaUrl+'"></audio>' +
      '</div>' +
      (lyricPath
        ? '<div class="lyrics" id="lyricBox"><div class="empty">载入歌词…</div></div>'
        : '<div class="empty">同目录没有歌词文件（歌词.md / .lrc）</div>') +
      '</div>';
    if (lyricPath) {
      fetch('/api/file?path='+encodeURIComponent(lyricPath))
        .then(r => { if (!r.ok) throw new Error('no lyrics'); return r.text(); })
        .then(text => bindLyrics($('#stageAudio'), parseLyrics(text)))
        .catch(() => { const b = $('#lyricBox'); if (b) b.innerHTML = '<div class="empty">歌词读取失败</div>'; });
    }
    return;
  }
  if (kind === 'video') {
    body.innerHTML = '<div class="media-frame"><video controls autoplay src="'+mediaUrl+'"></video></div>';
    return;
  }
  if (kind === 'pdf') {
    body.innerHTML = '<div class="office-view"><iframe src="'+mediaUrl+'" title="pdf"></iframe></div>';
    return;
  }
  if (kind === 'office') {
    fetch('/api/preview?path='+enc).then(r=>r.json()).then(d=>{
      body.innerHTML = '<div class="office-view out md">'+sanitize(d.html || d.error || '')+'</div>';
    }).catch(e=>{
      body.className = 'stage-body plain';
      body.textContent = e.message;
    });
    return;
  }
  if (kind === 'markdown' || kind === 'text') {
    fetch('/api/file?path='+enc).then(r=>{
      if (!r.ok) throw new Error('无法读取文件');
      return r.text();
    }).then(t=>{
      if (kind === 'markdown') {
        body.className = 'stage-body out md';
        body.innerHTML = renderMd(t);
      } else {
        body.className = 'stage-body plain';
        body.textContent = t;
      }
    }).catch(e=>{
      body.className = 'stage-body plain';
      body.textContent = e.message;
    });
    return;
  }
  body.innerHTML = '<div class="empty">此类型请下载查看。<br><button class="btn primary" onclick="downloadCurrent()">DOWNLOAD</button></div>';
}

function downloadCurrent() { if (currentDownload) window.open('/api/download?path='+encodeURIComponent(currentDownload)); }

function refreshSide() {
  const pTasks = fetch('/api/tasks').then(r=>r.json()).then(nodes=>{
    renderTree($('#tree'), nodes);
  }).catch(()=>{});
  fetch('/api/skills').then(r=>r.json()).then(list=>{
    $('#skills').innerHTML = '';
    if (!list.length) { $('#skills').innerHTML = '<div class="empty">无技能</div>'; return; }
    list.forEach(s => {
      const d = document.createElement('div'); d.className = 'skill-item';
      d.innerHTML = '<div class="n">'+esc(s.name)+'</div>'+(s.description?'<div class="d">'+esc(s.description)+'</div>':'');
      $('#skills').appendChild(d);
    });
  }).catch(()=>{});
  fetch('/api/memory').then(r=>r.json()).then(list=>{
    $('#memory').innerHTML = '';
    if (!list.length) { $('#memory').innerHTML = '<div class="empty">暂无记忆</div>'; return; }
    list.forEach(m => {
      const d = document.createElement('div'); d.className = 'mem-item';
      d.innerHTML = '<span>'+esc(m.name)+'</span><span class="file-sz">'+fmtSize(m.size)+' · '+fmtTime(m.mtime)+'</span>';
      $('#memory').appendChild(d);
    });
  }).catch(()=>{});
  renderSessions();
  return pTasks;
}

function renderSessions() {
  fetch('/api/sessions').then(r=>r.json()).then(list=>{
    const box = $('#sessions');
    if (!box) return;
    box.innerHTML = '';
    if (!list.length) { box.innerHTML = '<div class="empty">暂无会话</div>'; return; }
    list.forEach(s => {
      const d = document.createElement('div');
      d.className = 'sess-item' + (s.session_id === currentSession ? ' active' : '');
      const title = esc(s.title || '（无标题）');
      const count = s.message_count || 0;
      d.innerHTML =
        '<div class="t">' + title + '</div>' +
        '<div class="meta"><span>' + esc(s.agent || 'cursor') + '</span><span>' + count + ' 条</span><span>' + esc(s.updated || '') + '</span></div>' +
        '<button class="del" title="删除" onclick="event.stopPropagation(); deleteSession(\'' + esc(s.session_id) + '\')">✕</button>';
      d.onclick = () => openSession(s.session_id);
      box.appendChild(d);
    });
  }).catch(()=>{});
}

function openSession(sid) {
  fetch('/api/session/' + encodeURIComponent(sid)).then(r => {
    if (!r.ok) throw new Error('not found');
    return r.json();
  }).then(s => {
    currentSession = s.session_id;
    currentSessionTitle = s.title || '';
    $('#threadTitle').textContent = currentSessionTitle || '会话';
    $('#threadAgent').textContent = s.agent || 'cursor';
    if (s.agent) $('#agentSel').value = s.agent;
    renderSessionMessages(s);
    renderSessions();
  }).catch(()=>{});
}

function renderSessionMessages(s) {
  const root = $('#results');
  root.innerHTML = '';
  const hint = $('#emptyHint');
  if (hint) hint.remove();
  const msgs = s.messages || [];
  if (!msgs.length) {
    root.innerHTML = '<div class="empty">该会话暂无消息。</div>';
    return;
  }
  // 倒序：最新在顶部，与实时线程一致
  msgs.slice().reverse().forEach(m => {
    const el = document.createElement('div');
    el.className = 'turn';
    if (m.role === 'user') {
      el.innerHTML = '<div class="bubble user">' + esc(m.text || '') + '</div>';
    } else {
      const body = m.status === 'error'
        ? '<div class="out err">' + esc(m.text || '') + '</div>'
        : '<div class="out md">' + renderMd(m.text || '') + '</div>';
      el.innerHTML =
        '<div class="bubble assistant">' +
          '<div class="meta"><span class="badge ' + esc(m.status || 'done') + '">' + statusLabel(m.status || 'done') + '</span>' +
          '<span>' + esc(s.agent || 'cursor') + '</span><span>' + esc(m.ts || '') + '</span></div>' +
          body +
        '</div>';
    }
    root.appendChild(el);
  });
}

function newSession() {
  currentSession = null;
  currentSessionTitle = '';
  $('#threadTitle').textContent = '新会话';
  $('#threadAgent').textContent = $('#agentSel').value || 'cursor';
  $('#results').innerHTML = '<div class="empty" id="emptyHint">输入指令，或点下方快捷 chips。</div>';
  renderSessions();
  $('#msg').focus();
}

function deleteSession(sid) {
  fetch('/api/session/' + encodeURIComponent(sid) + '/delete', { method: 'POST' })
    .then(() => {
      if (currentSession === sid) newSession();
      renderSessions();
    })
    .catch(()=>{});
}

$('#msg').addEventListener('keydown', e => { if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) submit(); });

health(); initChips();
refreshSide().then(() => {
  fetch('/api/latest').then(r=>r.json()).then(item => {
    if (item && item.path) preview(item.path, item.kind);
  }).catch(()=>{});
});
setInterval(refreshSide, 30000); setInterval(health, 15000);
</script>
</body>
