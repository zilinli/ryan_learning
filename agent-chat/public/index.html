<!DOCTYPE html>
<html lang="zh-CN" style="color-scheme:dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Agent Chat Console</title>
<style>
:root{
  --bg:#1e1e2e;--bg2:#181825;--card:#313244;--input:#313244;--code:#11111b;
  --text:#cdd6f4;--text2:#a6adc8;--text3:#6c7086;
  --blue:#89b4fa;--purple:#cba6f7;--red:#f38ba8;--green:#a6e3a1;--yellow:#f9e2af;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--text);font:15px/1.6 "Source Sans 3",-apple-system,BlinkMacSystemFont,sans-serif}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--card);border-radius:3px}
#app{display:flex;height:100%;overflow:hidden}
#chat{flex:1;display:flex;flex-direction:column;min-width:0}
#header{display:flex;align-items:center;justify-content:space-between;padding:6px 14px;border-bottom:1px solid var(--card);flex-shrink:0}
#header .title{font-weight:600;font-size:15px}
#msgs{flex:1;overflow-y:auto;padding:12px 16px}
#msgs .empty{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;color:var(--text3);text-align:center}
#msgs .empty .icon{font-size:40px;margin-bottom:12px}
#msgs .empty h2{font-size:17px;margin-bottom:6px}
#msgs .empty p{font-size:13px}
.msg{margin-bottom:12px}
.msg .meta{font-size:10px;color:var(--text3);margin-bottom:2px}
.msg .bubble{max-width:85%;border-radius:12px;padding:8px 14px;font-size:13.5px;line-height:1.65;white-space:pre-wrap;word-break:break-word}
.msg.user{align-items:flex-end}
.msg.user .bubble{background:var(--blue);color:#11111b;border-bottom-right-radius:4px}
.msg.agent{align-items:flex-start}
.msg.agent .bubble{background:var(--card);color:var(--text);border-bottom-left-radius:4px}
.msg.agent .tools{margin-top:6px;border-top:1px solid #45475a;padding-top:4px;font-size:11px;color:var(--text2)}
.msg.agent .tools span{display:block}
.streaming .bubble{background:var(--card);border-bottom-left-radius:4px}
.streaming .status{font-size:11px;color:var(--text2);margin-bottom:4px}
.cursor::after{content:'▊';animation:blink 1s infinite;color:var(--blue)}
.dots span{display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--text3);animation:bounce 1.4s infinite ease-in-out}
.dots span:nth-child(1){animation-delay:-0.32s}
.dots span:nth-child(2){animation-delay:-0.16s}
#input-bar{padding:8px 14px 12px;border-top:1px solid var(--card);flex-shrink:0}
#input-row{display:flex;align-items:flex-end;gap:6px;background:var(--input);border-radius:10px;padding:4px 8px;border:1px solid #45475a}
#input-row textarea{flex:1;background:transparent;border:none;outline:none;color:var(--text);font:13px/22px inherit;resize:none;min-height:22px;max-height:120px;padding:0}
#input-row textarea::placeholder{color:var(--text3)}
.btn{background:none;border:none;cursor:pointer;font-size:13px;padding:4px 10px;border-radius:6px;font-weight:600;flex-shrink:0}
.btn-send{background:var(--purple);color:#11111b}
.btn-send:disabled{background:transparent;color:var(--text3);cursor:not-allowed;opacity:0.4}
.btn-voice{font-size:16px;padding:4px 8px;color:var(--text2)}
.btn-voice.recording{background:var(--red);color:#fff;animation:pulse 1.2s infinite}
.btn-header{background:none;border:none;color:var(--text2);cursor:pointer;font-size:16px;padding:6px 8px;border-radius:4px}
.btn-new{background:var(--card);border:none;color:var(--text);cursor:pointer;font-size:12px;padding:4px 12px;border-radius:6px}
#hint{display:flex;justify-content:space-between;margin-top:3px;font-size:10px;color:#585b70;padding-left:2px}
#sidebar{width:300px;border-left:1px solid var(--card);background:var(--bg2);display:flex;flex-direction:column;flex-shrink:0;overflow:hidden}
#sidebar-title{font-size:11px;font-weight:600;color:var(--text3);padding:8px 12px 6px;text-transform:uppercase;letter-spacing:0.5px}
#file-tree{flex:1;overflow-y:auto;padding:2px 4px;min-height:0}
#file-tree .loading,#file-tree .error{padding:12px;font-size:12px;color:var(--text3)}
#file-tree .error{color:var(--red)}
.node{cursor:pointer;padding:2px 8px;border-radius:4px;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text)}
.node:hover{background:var(--card)}
.node.sel{background:rgba(137,180,250,0.15);color:var(--blue)}
.node .size{color:var(--text3);margin-left:6px;font-size:10px}
#file-preview{border-top:1px solid var(--card);background:var(--code);display:flex;flex-direction:column;max-height:45%}
#file-preview .head{display:flex;align-items:center;justify-content:space-between;padding:6px 10px;border-bottom:1px solid var(--card);flex-shrink:0}
#file-preview .head .name{font-size:11px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#file-preview .head .info{color:var(--text3);margin-left:6px;font-size:10px}
#file-preview .head .close{background:none;border:none;color:var(--text3);cursor:pointer;font-size:14px}
#file-preview .body{flex:1;overflow:auto;padding:8px 0}
#file-preview .body pre{margin:0;padding:0 10px;font:11px/1.6 "JetBrains Mono",monospace;color:var(--text);white-space:pre-wrap;word-break:break-word}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}
@keyframes bounce{0%,80%,100%{transform:scale(0)}40%{transform:scale(1)}}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(243,139,168,0.4)}50%{box-shadow:0 0 0 6px rgba(243,139,168,0)}}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.msg,.streaming{animation:fadeIn .2s ease-out}
</style>
</head>
<body>
<div id="app">
  <div id="chat">
    <div id="header">
      <span class="title">Agent Chat Console</span>
      <button class="btn-new" onclick="newChat()">+ 新建</button>
    </div>
    <div id="msgs"><div class="empty"><div class="icon">🤖</div><h2>Agent Chat Console</h2><p>输入命令让 Cursor 帮你写代码 · 支持语音输入</p></div></div>
    <div id="input-bar">
      <div id="input-row">
        <button class="btn btn-voice" id="voiceBtn" onclick="toggleVoice()" title="语音输入">🎤</button>
        <textarea id="input" rows="1" placeholder="输入命令，让 Cursor 帮你写代码..." onkeydown="handleKey(event)" oninput="autoResize(this)"></textarea>
        <button class="btn btn-send" id="sendBtn" onclick="send()" disabled>发送</button>
      </div>
      <div id="hint"><span>Enter 发送 · Shift+Enter 换行</span><span>/root/codes/ryan_learning</span></div>
    </div>
  </div>
  <div id="sidebar">
    <div id="sidebar-title">📁 工作区</div>
    <div id="file-tree"><div class="loading">加载中...</div></div>
    <div id="file-preview" style="display:none">
      <div class="head">
        <span><span class="name" id="fp-name"></span><span class="info" id="fp-info"></span></span>
        <button class="close" onclick="closePreview()">✕</button>
      </div>
      <div class="body" id="fp-body"></div>
    </div>
  </div>
</div>

<script>
//========== STATE ==========
let msgs=[], sessId='', busy=false, streamingContent='', statusText='';
let wsTree=null, expanded=new Set(['/root/codes/ryan_learning']);
let selFile=null;
let recorder=null, recordStream=null, recording=false;

//========== DOM REFS ==========
const $msgs=document.getElementById('msgs');
const $input=document.getElementById('input');
const $send=document.getElementById('sendBtn');
const $voice=document.getElementById('voiceBtn');
const $tree=document.getElementById('file-tree');
const $fp=document.getElementById('file-preview');
const $fpName=document.getElementById('fp-name');
const $fpInfo=document.getElementById('fp-info');
const $fpBody=document.getElementById('fp-body');

//========== INIT ==========
loadWorkspace();

//========== WORKSPACE ==========
async function loadWorkspace(){
  try{
    const r=await fetch('/api/workspace?path=/root/codes/ryan_learning');
    const d=await r.json();
    if(r.ok){wsTree=d;renderTree()}
    else $tree.innerHTML='<div class="error">加载失败</div>';
  }catch(e){$tree.innerHTML='<div class="error">加载失败: '+e.message+'</div>'}
}

function renderTree(){
  $tree.innerHTML='';
  if(wsTree) $tree.appendChild(buildNode(wsTree,0));
}

function buildNode(node,depth){
  const div=document.createElement('div');
  div.className='node'+(selFile===node.path?' sel':'');
  const isExp=expanded.has(node.path);
  div.style.paddingLeft=(8+depth*14)+'px';
  div.innerHTML=(node.type==='directory'?(isExp?'📂':'📁'):'📄')+' '+node.name+
    (node.size!=null?' <span class="size">'+fmtSize(node.size)+'</span>':'');
  div.onclick=()=>{
    if(node.type==='directory'){
      if(expanded.has(node.path)) expanded.delete(node.path); else expanded.add(node.path);
      renderTree();
    }else{
      selFile=node.path;renderTree();loadFile(node.path);
    }
  };
  return div;
}

async function loadFile(path){
  selFile=path;
  $fp.style.display='flex';
  $fpName.textContent='📄 '+path.split('/').pop();
  $fpInfo.textContent='';
  $fpBody.innerHTML='<div style="padding:12px;color:var(--text3);font-size:12px">加载中...</div>';
  try{
    const r=await fetch('/api/workspace/file?path='+encodeURIComponent(path));
    const d=await r.json();
    if(r.ok){
      $fpName.textContent='📄 '+path.split('/').pop();
      $fpInfo.textContent=fmtSize(d.size)+' · '+d.lines+'行 · '+d.language;
      const text=d.content.length>10000?d.content.slice(0,10000)+'\n...(截断)':d.content;
      $fpBody.innerHTML='<pre><code>'+escHtml(text)+'</code></pre>';
    }else{
      $fpBody.innerHTML='<div style="padding:12px;color:var(--red);font-size:12px">加载失败: '+escHtml(d.error||'unknown')+'</div>';
    }
  }catch(e){
    $fpBody.innerHTML='<div style="padding:12px;color:var(--red);font-size:12px">加载失败: '+e.message+'</div>';
  }
}

function closePreview(){selFile=null;$fp.style.display='none';renderTree()}

//========== CHAT ==========
function newChat(){msgs=[];sessId='';streamingContent='';statusText='';busy=false;$input.disabled=false;$send.disabled=true;renderMsgs()}

async function send(){
  const text=$input.value.trim();
  if(!text||busy)return;
  $input.value='';$input.style.height='auto';
  $send.disabled=true;
  busy=true;
  streamingContent='';
  statusText='thinking...';
  renderMsgs();

  // Add user message
  msgs.push({id:genId(),role:'user',content:text,time:new Date().toISOString()});
  renderMsgs();
  scrollBottom();

  // Placeholder for assistant
  const asstId=genId();
  let fullContent='';
  let tools=[];

  try{
    const resp=await fetch('/api/chat',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({message:text,sessionId:sessId||undefined})
    });
    if(!resp.ok)throw new Error('HTTP '+resp.status);

    const reader=resp.body.getReader();
    const dec=new TextDecoder();
    let buf='';

    while(true){
      const{value,done}=await reader.read();
      if(done)break;
      buf+=dec.decode(value,{stream:true});
      const lines=buf.split('\n');
      buf=lines.pop()||'';

      for(const line of lines){
        if(!line.startsWith('data: '))continue;
        try{
          const d=JSON.parse(line.slice(6));
          switch(d.type){
            case'status':statusText=d.message||'';break;
            case'delta':fullContent+=d.content||'';streamingContent=fullContent;break;
            case'tool_call':case'tool_use':
              statusText=d.tool?'🔧 '+d.tool:statusText;
              tools.push({tool:d.tool||'?',input:d.input,output:d.output,status:d.output?'success':'running',time:new Date().toISOString()});
              break;
            case'error':statusText='❌ '+d.message;break;
            case'done':if(d.sessionId)sessId=d.sessionId;break;
          }
          renderMsgs();
        }catch(e){}
      }
    }
  }catch(e){
    fullContent='**Error**: '+e.message;
  }

  msgs.push({id:asstId,role:'agent',content:fullContent||'(no output)',tools:tools,hasTools:tools.length>0,time:new Date().toISOString()});
  streamingContent='';
  statusText='';
  busy=false;
  $input.disabled=false;
  $input.focus();
  renderMsgs();
  scrollBottom();
}

function renderMsgs(){
  if(msgs.length===0&&!busy){
    $msgs.innerHTML='<div class="empty"><div class="icon">🤖</div><h2>Agent Chat Console</h2><p>输入命令让 Cursor 帮你写代码 · 支持语音输入</p></div>';
    return;
  }
  let html='';
  for(const m of msgs){
    html+='<div class="msg '+m.role+'"><div class="meta">'+(m.role==='user'?'You':'Agent')+'</div>';
    html+='<div class="bubble">'+escHtml(m.content)+'</div>';
    if(m.tools&&m.tools.length){
      html+='<div class="tools">';
      for(const t of m.tools)html+='<span>🔧 '+escHtml(t.tool)+' '+(t.status==='success'?'✅':'⏳')+'</span>';
      html+='</div>';
    }
    html+='</div>';
  }
  if(busy){
    html+='<div class="streaming"><div class="meta">Agent</div><div class="bubble">';
    if(statusText)html+='<div class="status">'+escHtml(statusText)+'</div>';
    if(streamingContent)html+=escHtml(streamingContent)+'<span class="cursor"></span>';
    else html+='<div class="dots"><span></span><span></span><span></span></div>';
    html+='</div></div>';
  }
  $msgs.innerHTML=html;
}

function scrollBottom(){
  setTimeout(()=>{$msgs.scrollTop=$msgs.scrollHeight},50);
}

function handleKey(e){
  if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}
}

function autoResize(el){
  el.style.height='auto';el.style.height=Math.min(el.scrollHeight,120)+'px';
  $send.disabled=!el.value.trim()||busy;
}

//========== VOICE ==========
async function toggleVoice(){
  if(recording){stopRecording();return}
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(SR){
    const r=new SR();r.lang='zh-CN';r.interimResults=false;
    r.onresult=e=>{$input.value=e.results[0][0].transcript;$send.disabled=false;stopRecording()};
    r.onerror=stopRecording;r.onend=stopRecording;
    r.start();recording=true;$voice.classList.add('recording');
  }else{
    // Server fallback
    try{
      recordStream=await navigator.mediaDevices.getUserMedia({audio:true});
      recorder=new MediaRecorder(recordStream,{mimeType:'audio/webm'});
      const chunks=[];
      recorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};
      recorder.onstop=async()=>{
        recordStream.getTracks().forEach(t=>t.stop());
        stopRecording();
        const blob=new Blob(chunks,{type:'audio/webm'});
        const fd=new FormData();fd.append('audio',blob,'rec.webm');
        try{
          const r=await fetch('/api/transcribe',{method:'POST',body:fd});
          const d=await r.json();
          if(d.text){$input.value=d.text;$send.disabled=false;$input.focus()}
        }catch(e){}
      };
      recorder.start();
      recording=true;$voice.classList.add('recording');
      setTimeout(()=>{if(recorder&&recorder.state==='recording')recorder.stop()},15000);
    }catch(e){}
  }
}

function stopRecording(){
  recording=false;$voice.classList.remove('recording');
}

//========== UTILS ==========
function genId(){return Math.random().toString(36).slice(2,10)}
function fmtSize(b){if(b<1024)return b+'B';if(b<1024*1024)return(b/1024).toFixed(1)+'KB';return(b/(1024*1024)).toFixed(1)+'MB'}
function escHtml(s){if(!s)return'';const d=document.createElement('div');d.textContent=s;return d.innerHTML}
</script>
</body>
</html>
